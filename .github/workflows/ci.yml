name: CI

on:
  # 기준(base) 브랜치: PROD_SCH (CLAUDE.md "Git 워크플로우" 2026-09-07 선언과 일치)
  pull_request:
    branches: [PROD_SCH]

jobs:
  repo-health:
    name: 저장소 상태 점검 (harness_19 보완 — 문서 템플릿이 아닌 저장소 상태 자체 검증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .gitignore 존재 확인
        run: test -f .gitignore || (echo ".gitignore가 없습니다 — 하네스 실패 패턴 #2 재발" && exit 1)

      - name: 빌드 산출물(__pycache__/.pyc 등)이 커밋되지 않았는지 확인
        run: |
          leftover=$(git ls-files | grep -E '__pycache__|\.pyc$|\.pytest_cache' || true)
          if [ -n "$leftover" ]; then
            echo "커밋된 빌드 산출물 발견 (브랜치 전환 잔여물 가능성):"
            echo "$leftover"
            exit 1
          fi

      - name: PR 대상 브랜치가 이 브랜치의 커밋 전체를 실제로 포함하는지 확인 (부분 병합 방지)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD; then
            echo "이 브랜치가 base(${{ github.base_ref }})보다 뒤처져 있습니다 — 먼저 base를 반영하세요."
            exit 1
          fi

  secret-scan:
    name: 시크릿 스캔 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 설치 및 실행
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  dependency-scan:
    name: 의존성 취약점 스캔 (스택 확정 — docs/tech_conventions.md, 2026-09-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 백엔드(Python) 의존성 스캔 - pip-audit
        run: |
          if [ -f src/backend/requirements.txt ]; then
            pip install pip-audit
            pip-audit -r src/backend/requirements.txt
          else
            echo "src/backend/requirements.txt 없음 — 백엔드 미착수, 스킵"
          fi
      - name: 프론트엔드(Node) 의존성 스캔 - npm audit
        run: |
          if [ -f src/frontend/package.json ]; then
            cd src/frontend && npm audit --audit-level=high
          else
            echo "src/frontend/package.json 없음 — 프론트엔드 미착수, 스킵"
          fi

  lint:
    name: 정적 분석/포맷팅/타입체크 (스택 확정 — docs/tech_conventions.md, 2026-09-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 백엔드 lint/format/type-check - ruff + mypy
        run: |
          if [ -f src/backend/requirements.txt ]; then
            pip install ruff mypy
            ruff check src/backend
            mypy src/backend/app
          else
            echo "src/backend 없음 — 백엔드 미착수, 스킵"
          fi
      - name: 프론트엔드 lint/format/type-check - eslint
        run: |
          if [ -f src/frontend/package.json ]; then
            cd src/frontend && npm ci && npm run lint
          else
            echo "src/frontend 없음 — 프론트엔드 미착수, 스킵"
          fi

  test:
    name: TRD §6 기반 테스트 (스택 확정 — docs/tech_conventions.md, 2026-09-07)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci_test_only@localhost:5432/aimock_test
      JWT_SECRET: ci-test-only-secret
      MEDIA_ENCRYPTION_KEY: k86IFwa9sPVr0re2TATgKNzRs_yuQInAWQzrApfYD70=
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: aimock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: 백엔드 테스트 - alembic 마이그레이션 + pytest (AC 대응, docs/trd/aimock_master_trd.md §5 참조)
        run: |
          if [ -f src/backend/requirements.txt ]; then
            pip install -r src/backend/requirements.txt
            cd src/backend && python -m alembic upgrade head && cd ../..
            pytest tests/backend -v
          else
            echo "src/backend 없음 — 백엔드 미착수, 스킵"
          fi
