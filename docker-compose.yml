# ADR-005: 로컬 Docker Compose 배포(Kubernetes/GCP 대체)
# ADR-003: PostgreSQL + pgvector 단일 DB (Redis/Celery 없음)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aimock
      POSTGRES_PASSWORD: aimock_dev_only
      POSTGRES_DB: aimock
    ports:
      # 호스트 55432 사용 — 로컬에 이미 5432를 쓰는 다른 Postgres가 있을 수 있어 충돌 방지
      - "55432:5432"
    volumes:
      - aimock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./src/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aimock:aimock_dev_only@postgres:5432/aimock
    ports:
      - "8000:8000"
    volumes:
      # ADR-007 1단계 보안 강화(2026-09-08): 읽기전용으로 변경 — 원래
      # 전체쓰기(777)로 노출되던 게 코드 샌드박스 우회 경로가 될 수
      # 있었음(내부테스트결과서 참조). --reload를 안 써서 실질적 핫리로드
      # 용도로도 안 쓰이고 있어 기능 손실 없음. uploads는 앱이 실제로
      # 써야 해서 별도로 계속 쓰기 가능하게 유지.
      - ./src/backend:/app:ro
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # 프로덕션 정적 빌드 확인용(2026-09-08 추가). 기본값으로는 안 뜸 —
    # `docker compose --profile prod up -d`로만 실행. 평소 개발은
    # `cd src/frontend && npm run dev`(포트 5173) 그대로 사용.
    profiles: ["prod"]
    build:
      context: ./src/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  aimock_pgdata:
