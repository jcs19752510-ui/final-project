name: CI

on:
  # 프로젝트 착수 시 실제 기준(base) 브랜치명으로 교체하세요 (CLAUDE.md에 선언한 것과 일치시킬 것)
  pull_request:
    branches: [main]

jobs:
  repo-health:
    name: 저장소 상태 점검 (harness_19 보완 — 문서 템플릿이 아닌 저장소 상태 자체 검증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .gitignore 존재 확인
        run: test -f .gitignore || (echo ".gitignore가 없습니다 — 하네스 실패 패턴 #2 재발" && exit 1)

      - name: 빌드 산출물(__pycache__/.pyc 등)이 커밋되지 않았는지 확인
        run: |
          leftover=$(git ls-files | grep -E '__pycache__|\.pyc$|\.pytest_cache' || true)
          if [ -n "$leftover" ]; then
            echo "커밋된 빌드 산출물 발견 (브랜치 전환 잔여물 가능성):"
            echo "$leftover"
            exit 1
          fi

      - name: PR 대상 브랜치가 이 브랜치의 커밋 전체를 실제로 포함하는지 확인 (부분 병합 방지)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD; then
            echo "이 브랜치가 base(${{ github.base_ref }})보다 뒤처져 있습니다 — 먼저 base를 반영하세요."
            exit 1
          fi

  secret-scan:
    name: 시크릿 스캔 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 설치 및 실행
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  dependency-scan:
    name: 의존성 취약점 스캔 (스택 확정 후 구체화 — harness_13_tech_conventions.md §7 참조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 의존성 취약점 스캔 실행
        run: echo "프로젝트 스택 확정 후 채우기 (예: npm audit / pip-audit / osv-scanner)"

  lint:
    name: 정적 분석/포맷팅/타입체크 (스택 확정 후 구체화 — harness_13_tech_conventions.md §4 참조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint/format/type-check 실행
        run: echo "프로젝트 스택 확정 후 채우기 (예: eslint+prettier / ruff+mypy)"

  test:
    name: TRD §6 기반 테스트 (스택 확정 후 구체화)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 의존성 설치
        run: echo "프로젝트 스택 확정 후 채우기 (harness_13_tech_conventions.md 참조)"
      - name: 테스트 실행 (AC 기반)
        run: echo "TRD §6 기반 테스트 스위트 실행"
